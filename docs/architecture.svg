<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 440" width="1080" height="440" font-family="Segoe UI, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">A6 Refund Request Risk Classifier integration architecture</title>
  <desc id="desc">A customer submits a refund request through the Refund Portal. The Refund API validates the input, calls the Jev decision capability, validates the typed output, and applies deterministic guardrails before routing to auto-approval, manual inspection, or the fraud team. Any failure routes to the manual support queue.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c53030"/>
    </marker>
  </defs>

  <rect width="1080" height="440" fill="#ffffff"/>

  <text x="540" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1a202c">A6 — Refund Request Risk Classifier</text>
  <text x="540" y="56" text-anchor="middle" font-size="12.5" fill="#4a5568">Jev supplies the typed decision; the Refund API validates it and enforces deterministic fallbacks.</text>

  <rect x="30" y="125" width="130" height="70" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="95" y="154" text-anchor="middle" font-size="15" font-weight="600" fill="#1a365d">Customer</text>
  <text x="95" y="175" text-anchor="middle" font-size="11" fill="#2d3748">refund request</text>

  <rect x="200" y="125" width="150" height="70" rx="10" fill="#e8f1fb" stroke="#2b6cb0" stroke-width="1.5"/>
  <text x="275" y="154" text-anchor="middle" font-size="15" font-weight="600" fill="#1a365d">Refund Portal</text>
  <text x="275" y="175" text-anchor="middle" font-size="11" fill="#2d3748">web / mobile form</text>

  <rect x="390" y="80" width="250" height="160" rx="12" fill="#f7fafc" stroke="#2b6cb0" stroke-width="2"/>
  <text x="515" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#1a365d">Refund API (Node / TypeScript)</text>

  <rect x="405" y="113" width="220" height="30" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="515" y="133" text-anchor="middle" font-size="11.5" fill="#2d3748">1. Validate input schema</text>

  <rect x="405" y="148" width="220" height="30" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="515" y="168" text-anchor="middle" font-size="11.5" fill="#2d3748">2. Call Jev decision</text>

  <rect x="405" y="183" width="220" height="30" rx="6" fill="#ffffff" stroke="#a0aec0"/>
  <text x="515" y="203" text-anchor="middle" font-size="11.5" fill="#2d3748">3. Validate output + guardrails</text>

  <rect x="700" y="95" width="240" height="120" rx="12" fill="#f0e9fb" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="820" y="119" text-anchor="middle" font-size="15" font-weight="600" fill="#44337a">Jev Decision</text>
  <text x="820" y="141" text-anchor="middle" font-size="11.5" fill="#44337a">refund_risk — choice (3 options)</text>
  <text x="820" y="159" text-anchor="middle" font-size="11.5" fill="#44337a">fraud_signal — noul</text>
  <text x="820" y="180" text-anchor="middle" font-size="11.5" fill="#553c9a">Playground (evidence) / API (prod)</text>
  <text x="820" y="198" text-anchor="middle" font-size="11.5" fill="#553c9a">typed answer + probabilities</text>

  <line x1="160" y1="160" x2="198" y2="160" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="160" x2="388" y2="160" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="160" x2="698" y2="160" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="669" y="149" text-anchor="middle" font-size="10.5" fill="#4a5568">request</text>

  <rect x="350" y="310" width="190" height="70" rx="10" fill="#e6f4ea" stroke="#2f855a" stroke-width="1.5"/>
  <text x="445" y="339" text-anchor="middle" font-size="14" font-weight="600" fill="#22543d">Payments / Refund</text>
  <text x="445" y="359" text-anchor="middle" font-size="11" fill="#276749">auto-approve &amp; pay out</text>

  <rect x="590" y="310" width="190" height="70" rx="10" fill="#fff4e5" stroke="#c53030" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text x="685" y="339" text-anchor="middle" font-size="14" font-weight="600" fill="#7b341e">Support Queue</text>
  <text x="685" y="359" text-anchor="middle" font-size="11" fill="#975a16">manual inspection (fallback)</text>

  <rect x="830" y="310" width="190" height="70" rx="10" fill="#fde8e8" stroke="#c53030" stroke-width="1.5"/>
  <text x="925" y="339" text-anchor="middle" font-size="14" font-weight="600" fill="#742a2a">Risk &amp; Fraud Team</text>
  <text x="925" y="359" text-anchor="middle" font-size="11" fill="#9b2c2c">investigate &amp; block</text>

  <path d="M 515 240 C 515 280, 445 280, 445 310" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 515 240 L 685 310" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 515 240 C 515 280, 925 280, 925 310" fill="none" stroke="#4a5568" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="455" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#2f855a">AUTO</text>
  <text x="700" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#c53030">MANUAL</text>
  <text x="935" y="298" text-anchor="middle" font-size="10.5" font-weight="600" fill="#c53030">FRAUD</text>

  <line x1="360" y1="414" x2="398" y2="414" stroke="#4a5568" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="408" y="418" font-size="11.5" fill="#2d3748">decision path</text>

  <rect x="520" y="405" width="30" height="18" rx="4" fill="#fff4e5" stroke="#c53030" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="560" y="418" font-size="11.5" fill="#2d3748">fallback target</text>

  <text x="700" y="418" font-size="11.5" fill="#4a5568">Invalid input, invalid output, timeout, service error, low confidence, or policy override → Support Queue.</text>
</svg>
